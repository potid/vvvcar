<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVV CAR - ตรวจสอบสถานะงาน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }
        .gradient-status { background: linear-gradient(135deg, #14532d 0%, #15803d 50%, #22c55e 100%); }
    </style>
</head>
<body class="pb-16 max-w-md mx-auto min-h-screen bg-slate-50 shadow-xl border-x border-slate-200">
    <header class="gradient-status text-white p-5 rounded-b-2xl shadow-lg relative">
        <div class="flex justify-between items-center">
            <div>
                <span class="bg-emerald-500/30 text-emerald-100 text-xs px-2.5 py-1 rounded-full border border-emerald-400/30 font-medium">VVV CAR @vvvcar</span>
                <h1 class="text-2xl font-bold tracking-tight mt-1"><i class="fa-solid fa-list-check text-emerald-200 mr-2"></i>เช็กสถานะงานซ่อม/สปา</h1>
                <p class="text-slate-100 text-xs mt-0.5">ค้นหาด้วยเลขทะเบียนรถ เพื่อดูสถานะ</p>
            </div>
            <div class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center border border-white/20">
                <i class="fa-solid fa-magnifying-glass-chart text-xl text-emerald-200"></i>
            </div>
        </div>
    </header>

    <main class="p-4 space-y-4">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <h3 class="font-bold text-slate-800 text-sm mb-2"><i class="fa-solid fa-car text-emerald-600 mr-2"></i>ระบุเลขทะเบียนรถ หรือ ชื่อ</h3>
            <div class="flex gap-2">
                <input type="text" id="searchPlate" placeholder="เช่น กข1234" oninput="searchJob()" class="flex-1 text-sm p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none uppercase">
                <button onclick="loadData()" class="bg-emerald-600 text-white font-semibold px-4 rounded-lg text-sm hover:bg-emerald-700 transition-all flex items-center gap-1">
                    <i class="fa-solid fa-rotate"></i> โหลดข้อมูล
                </button>
            </div>
        </div>

        <div id="resultContainer" class="space-y-4">
            <div class="bg-blue-50 border border-blue-200 text-blue-800 p-6 rounded-xl text-xs text-center space-y-2">
                <i class="fa-solid fa-magnifying-glass text-blue-500 text-2xl"></i>
                <p class="font-bold text-sm">กรุณากดปุ่ม "โหลดข้อมูล" ด้านบน เพื่อเริ่มค้นหา</p>
            </div>
        </div>
    </main>

    <script>
        var allJobs = [];

        function loadData() {
            var container = document.getElementById('resultContainer');
            container.innerHTML = '<div class="bg-white p-8 rounded-xl border border-dashed border-slate-300 text-center text-slate-400 text-xs"><i class="fa-solid fa-spinner fa-spin text-2xl text-emerald-600 mb-2"></i><br>กำลังดึงข้อมูลจากระบบ...</div>';

            fetch("https://firestore.googleapis.com/v1/projects/vvvcar/databases/(default)/documents/jobs")
                .then(function(response) {
                    return response.json();
                })
                .then(function(data) {
                    allJobs = [];
                    if (data && data.documents && Array.isArray(data.documents)) {
                        data.documents.forEach(function(doc) {
                            var f = doc.fields || {};
                            var getVal = function(val) {
                                return val ? (val.stringValue || val.integerValue || val.doubleValue || '-') : '-';
                            };
                            
                            allJobs.push({
                                carPlate: getVal(f.carPlate),
                                custName: getVal(f.custName),
                                custPhone: getVal(f.custPhone),
                                carModel: getVal(f.carModel),
                                jobType: getVal(f.jobType),
                                bookingDate: getVal(f.bookingDate),
                                status: getVal(f.status) || 'จองคิวใหม่',
                                approvalStatus: getVal(f.approvalStatus) || 'รออนุมัติ',
                                paymentStatus: getVal(f.paymentStatus) || 'รอมัดจำ'
                            });
                        });
                    }
                    container.innerHTML = '<div class="bg-emerald-50 border border-emerald-200 text-emerald-800 p-6 rounded-xl text-xs text-center space-y-1"><p class="font-bold text-sm">โหลดข้อมูลสำเร็จ! (' + allJobs.length + ' คิวในระบบ)</p><p class="text-[11px] text-slate-500">พิมพ์เลขทะเบียนเพื่อค้นหาได้เลยครับ</p></div>';
                })
                .catch(function(err) {
                    container.innerHTML = '<div class="bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl text-xs text-center">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>';
                });
        }

        function searchJob() {
            var keyword = document.getElementById('searchPlate').value.trim().toLowerCase().replace(/\s+/g, '');
            var container = document.getElementById('resultContainer');

            if (!keyword) {
                container.innerHTML = '<div class="bg-blue-50 border border-blue-200 text-blue-800 p-6 rounded-xl text-xs text-center space-y-2"><i class="fa-solid fa-magnifying-glass text-blue-500 text-2xl"></i><p class="font-bold text-sm">กรุณากรอกเลขทะเบียนรถ หรือ ชื่อ เพื่อค้นหา</p></div>';
                return;
            }

            var filtered = allJobs.filter(function(job) {
                var plate = job.carPlate.toLowerCase().replace(/\s+/g, '');
                var name = job.custName.toLowerCase();
                return plate.indexOf(keyword) !== -1 || name.indexOf(keyword) !== -1;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="bg-amber-50 border border-amber-200 text-amber-800 p-6 rounded-xl text-xs text-center"><p class="font-bold text-sm">ไม่พบข้อมูลที่ค้นหา</p></div>';
                return;
            }

            container.innerHTML = "";
            filtered.forEach(function(job) {
                var isRepair = job.jobType === "ซ่อมเครื่องยนต์";
                var badgeClass = isRepair ? 'bg-blue-100 text-blue-700' : 'bg-cyan-100 text-cyan-700';
                
                var htmlCard = '<div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">' +
                    '<div class="flex justify-between items-start border-b pb-2">' +
                        '<div>' +
                            '<span class="text-[10px] ' + badgeClass + ' font-bold px-2 py-0.5 rounded">' + job.jobType + '</span>' +
                            '<h4 class="font-bold text-slate-800 text-base mt-1">HONDA ' + job.carModel + ' (' + job.carPlate + ')</h4>' +
                            '<p class="text-xs text-slate-500">คุณ' + job.custName + ' | โทร: ' + job.custPhone + '</p>' +
                        '</div>' +
                        '<div class="text-right">' +
                            '<span class="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-full border border-amber-300 block">' + job.status + '</span>' +
                            '<span class="text-[10px] text-emerald-700 font-bold mt-1 block">[' + job.approvalStatus + ']</span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="bg-slate-50 p-3 rounded-lg border border-slate-200 flex justify-between items-center text-xs">' +
                        '<span class="font-bold text-slate-700">สถานะชำระเงิน:</span>' +
                        '<span class="font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded border border-emerald-300">' + job.paymentStatus + '</span>' +
                    '</div>' +
                '</div>';
                
                container.innerHTML += htmlCard;
            });
        }
    </script>
</body>
</html>
