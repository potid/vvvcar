<script>
    let allJobs = [];

    window.onload = function() {
        fetchData();
    };

    function fetchData() {
        const container = document.getElementById('resultContainer');
        container.innerHTML = `
            <div class="bg-blue-50 border border-blue-200 text-blue-800 p-6 rounded-xl text-xs text-center space-y-2">
                <i class="fa-solid fa-magnifying-glass text-blue-500 text-2xl"></i>
                <p class="font-bold text-sm">กรุณากรอกเลขทะเบียนรถ หรือ ชื่อ เพื่อตรวจสอบสถานะ</p>
                <p class="text-[11px] text-slate-500">เช่น พิมพ์เลขทะเบียนรถเพื่อค้นหาข้อมูล</p>
            </div>
        `;

        fetch("https://firestore.googleapis.com/v1/projects/vvvcar/databases/(default)/documents/jobs")
            .then(response => {
                if (!response.ok) throw new Error("เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ");
                return response.json();
            })
            .then(data => {
                allJobs = [];
                if (data && data.documents && Array.isArray(data.documents)) {
                    data.documents.forEach(doc => {
                        const f = doc.fields || {};
                        const getVal = (val) => val ? (val.stringValue || val.integerValue || val.doubleValue || '-') : '-';
                        
                        allJobs.push({
                            carPlate: getVal(f.carPlate),
                            custName: getVal(f.custName),
                            custPhone: getVal(f.custPhone),
                            carModel: getVal(f.carModel),
                            jobType: getVal(f.jobType),
                            bookingDate: getVal(f.bookingDate),
                            status: getVal(f.status) || 'จองคิวใหม่',
                            approvalStatus: getVal(f.approvalStatus) || 'รออนุมัติ',
                            paymentStatus: getVal(f.paymentStatus) || 'รอมัดจำ'
                        });
                    });
                }
                // โหลดข้อมูลเก็บไว้ในหน่วยความจำเรียบร้อย แต่ยังไม่แสดงผลจนกว่าจะพิมพ์ค้นหา
            })
            .catch(err => {
                console.error(err);
            });
    }

    function renderUI() {
        const keyword = document.getElementById('searchPlate').value.trim().toLowerCase().replace(/\s+/g, '');
        const container = document.getElementById('resultContainer');

        // ถ้าช่องค้นหาว่าง ให้แสดงหน้าจอแนะนำการค้นหาแบบโล่งๆ
        if (!keyword) {
            container.innerHTML = `
                <div class="bg-blue-50 border border-blue-200 text-blue-800 p-6 rounded-xl text-xs text-center space-y-2">
                    <i class="fa-solid fa-magnifying-glass text-blue-500 text-2xl"></i>
                    <p class="font-bold text-sm">กรุณากรอกเลขทะเบียนรถ หรือ ชื่อ เพื่อตรวจสอบสถานะ</p>
                    <p class="text-[11px] text-slate-500">เช่น พิมพ์เลขทะเบียนรถเพื่อค้นหาข้อมูล</p>
                </div>
            `;
            return;
        }

        let filtered = allJobs.filter(job => {
            const plate = job.carPlate.toLowerCase().replace(/\s+/g, '');
            const name = job.custName.toLowerCase();
            return plate.includes(keyword) || name.includes(keyword);
        });

        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="bg-amber-50 border border-amber-200 text-amber-800 p-6 rounded-xl text-xs text-center space-y-1">
                    <p class="font-bold text-sm">ไม่พบข้อมูลทะเบียน "${document.getElementById('searchPlate').value}"</p>
                    <p class="text-[11px] text-slate-500">ตรวจสอบความถูกต้องของเลขทะเบียนอีกครั้งครับ</p>
                </div>
            `;
            return;
        }

        container.innerHTML = "";
        filtered.forEach(job => {
            const isRepair = job.jobType === "ซ่อมเครื่องยนต์";
            container.innerHTML += `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                    <div class="flex justify-between items-start border-b pb-2">
                        <div>
                            <span class="text-[10px] ${isRepair ? 'bg-blue-100 text-blue-700' : 'bg-cyan-100 text-cyan-700'} font-bold px-2 py-0.5 rounded">
                                ${job.jobType}
                            </span>
                            <h4 class="font-bold text-slate-800 text-base mt-1">HONDA ${job.carModel} (${job.carPlate})</h4>
                            <p class="text-xs text-slate-500">คุณ${job.custName} | โทร: ${job.custPhone}</p>
                        </div>
                        <div class="text-right">
                            <span class="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-full border border-amber-300 block">
                                ${job.status}
                            </span>
                            <span class="text-[10px] text-emerald-700 font-bold mt-1 block">
                                [${job.approvalStatus}]
                            </span>
                        </div>
                    </div>

                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 flex justify-between items-center text-xs">
                        <span class="font-bold text-slate-700">สถานะชำระเงิน:</span>
                        <span class="font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded border border-emerald-300">${job.paymentStatus}</span>
                    </div>
                </div>
            `;
        });
    }
</script>
