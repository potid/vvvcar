<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVV CAR - ตรวจสอบสถานะงาน & ชำระเงิน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }
        .gradient-status { background: linear-gradient(135deg, #14532d 0%, #15803d 50%, #22c55e 100%); }
    </style>
</head>
<body class="pb-16 max-w-md mx-auto min-h-screen bg-slate-50 shadow-xl border-x border-slate-200">
    <header class="gradient-status text-white p-5 rounded-b-2xl shadow-lg relative">
        <div class="flex justify-between items-center">
            <div>
                <span class="bg-emerald-500/30 text-emerald-100 text-xs px-2.5 py-1 rounded-full border border-emerald-400/30 font-medium">VVV CAR @vvvcar</span>
                <h1 class="text-2xl font-bold tracking-tight mt-1"><i class="fa-solid fa-list-check text-emerald-200 mr-2"></i>เช็กสถานะงานซ่อม/สปา</h1>
                <p class="text-slate-100 text-xs mt-0.5">ค้นหาด้วยเลขทะเบียนรถ เพื่อดูสถานะ</p>
            </div>
            <div class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center border border-white/20">
                <i class="fa-solid fa-magnifying-glass-chart text-xl text-emerald-200"></i>
            </div>
        </div>
    </header>

    <main class="p-4 space-y-4">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <h3 class="font-bold text-slate-800 text-sm mb-2"><i class="fa-solid fa-car text-emerald-600 mr-2"></i>ระบุเลขทะเบียนรถ หรือ ชื่อ</h3>
            <div class="flex gap-2">
                <input type="text" id="searchPlate" placeholder="เช่น กข 1234" oninput="filterJobs()" class="flex-1 text-sm p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none uppercase">
                <button onclick="fetchAllJobs()" class="bg-emerald-600 text-white font-semibold px-4 rounded-lg text-sm hover:bg-emerald-700 transition-all flex items-center gap-1">
                    <i class="fa-solid fa-rotate"></i> รีเฟรช
                </button>
            </div>
        </div>

        <div id="searchResults" class="space-y-4">
            <div class="bg-white p-8 rounded-xl border border-dashed border-slate-300 text-center text-slate-400 text-xs">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-emerald-600 mb-2"></i><br>กำลังดึงข้อมูลคิวรถ...
            </div>
        </div>
    </main>

    <script>
        const PROJECT_ID = "vvvcar";
        const REST_API_URL = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/jobs`;
        let cachedJobs = [];

        window.addEventListener('DOMContentLoaded', fetchAllJobs);

        function fetchAllJobs() {
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = `
                <div class="bg-white p-8 rounded-xl border border-dashed border-slate-300 text-center text-slate-400 text-xs">
                    <i class="fa-solid fa-spinner fa-spin text-2xl text-emerald-600 mb-2"></i><br>กำลังเชื่อมต่อข้อมูล VVV CAR...
                </div>
            `;

            fetch(REST_API_URL)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    cachedJobs = [];
                    if (data && data.documents && Array.isArray(data.documents)) {
                        cachedJobs = data.documents.map(doc => {
                            const fields = doc.fields || {};
                            const parseField = (f) => f ? (f.stringValue || f.integerValue || f.doubleValue || '') : '';

                            return {
                                id: doc.name ? doc.name.split('/').pop() : '',
                                jobType: parseField(fields.jobType) || 'ฟื้นฟู',
                                custName: parseField(fields.custName) || '-',
                                custPhone: parseField(fields.custPhone) || '-',
                                carPlate: parseField(fields.carPlate) || '-',
                                carModel: parseField(fields.carModel) || '-',
                                bookingDate: parseField(fields.bookingDate) || '-',
                                status: parseField(fields.status) || 'จองคิวใหม่',
                                approvalStatus: parseField(fields.approvalStatus) || 'รออนุมัติ',
                                paymentStatus: parseField(fields.paymentStatus) || 'รอมัดจำ'
                            };
                        });
                    }
                    filterJobs();
                })
                .catch(error => {
                    console.error('Fetch error:', error);
                    resultsDiv.innerHTML = `
                        <div class="bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl text-xs text-center space-y-2">
                            <i class="fa-solid fa-triangle-exclamation text-xl text-red-500"></i>
                            <p class="font-bold">เกิดข้อผิดพลาดในการโหลดข้อมูล</p>
                            <p class="text-[11px] bg-white p-2 rounded border border-red-100 text-slate-600">${error.message}</p>
                            <button onclick="fetchAllJobs()" class="mt-2 bg-red-600 text-white font-bold px-3 py-1 rounded text-xs">ลองอีกครั้ง</button>
                        </div>
                    `;
                });
        }

        function filterJobs() {
            const rawVal = document.getElementById('searchPlate').value.trim();
            const keyword = rawVal.toLowerCase().replace(/\s+/g, '');
            const resultsDiv = document.getElementById('searchResults');

            let filtered = cachedJobs;
            if (keyword) {
                filtered = cachedJobs.filter(job => {
                    const plate = (job.carPlate || '').toLowerCase().replace(/\s+/g, '');
                    const name = (job.custName || '').toLowerCase();
                    return plate.includes(keyword) || name.includes(keyword);
                });
            }

            if (filtered.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="bg-amber-50 border border-amber-200 text-amber-800 p-6 rounded-xl text-xs text-center space-y-2">
                        <i class="fa-solid fa-car-side text-amber-500 text-2xl"></i>
                        <p class="font-bold text-sm">${keyword ? 'ไม่พบข้อมูลทะเบียน "' + rawVal + '"' : 'ยังไม่มีคิวรถในระบบ'}</p>
                        <p class="text-[11px] text-slate-600">หากเพิ่งจองเข้ามา ลองกดปุ่ม "รีเฟรช" ด้านบนอีกครั้งครับ</p>
                    </div>
                `;
                return;
            }

            resultsDiv.innerHTML = "";
            filtered.forEach(data => {
                const isRepair = data.jobType === "ซ่อมเครื่องยนต์";
                const cardHtml = `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4">
                        <div class="flex justify-between items-start border-b pb-3">
                            <div>
                                <span class="text-[10px] ${isRepair ? 'bg-blue-100 text-blue-700' : 'bg-cyan-100 text-cyan-700'} font-bold px-2 py-0.5 rounded">
                                    ${data.jobType}
                                </span>
                                <h4 class="font-bold text-slate-800 text-base mt-1">HONDA ${data.carModel} (${data.carPlate})</h4>
                                <p class="text-xs text-slate-500">คุณ${data.custName} | ${data.custPhone}</p>
                            </div>
                            <div class="text-right">
                                <span class="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-full border border-amber-300 block">
                                    ${data.status}
                                </span>
                                <span class="text-[10px] text-emerald-700 font-bold mt-1 block">
                                    [${data.approvalStatus}]
                                </span>
                            </div>
                        </div>

                        <div class="space-y-3 relative pl-4 border-l-2 border-emerald-300 ml-2 text-xs py-1">
                            <div class="relative">
                                <span class="absolute -left-[21px] top-0.5 w-3 h-3 bg-emerald-600 rounded-full ring-4 ring-emerald-100"></span>
                                <p class="font-bold text-emerald-800">1. ยืนยันรับรถเข้าอู่ (นัด: ${data.bookingDate})</p>
                            </div>
                            <div class="relative">
                                <span class="absolute -left-[21px] top-0.5 w-3 h-3 ${data.status !== 'จองคิวใหม่' ? 'bg-emerald-600 ring-4 ring-emerald-100' : 'bg-slate-300'} rounded-full"></span>
                                <p class="font-bold ${data.status !== 'จองคิวใหม่' ? 'text-emerald-800' : 'text-slate-400'}">${isRepair ? '2. ถอดเครื่อง & ไล่น้ำ' : '2. ถอดเบาะ พรม ทำความสะอาด'}</p>
                            </div>
                            <div class="relative">
                                <span class="absolute -left-[21px] top-0.5 w-3 h-3 ${data.status === 'กำลังประกอบ & ทดสอบ' || data.status === 'พร้อมส่งมอบรถ' ? 'bg-emerald-600 ring-4 ring-emerald-100' : 'bg-slate-300'} rounded-full"
